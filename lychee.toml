verbose = "info"
no_progress = true

max_retries = 4
timeout = 20
retry_wait_time = 5

max_concurrency = 8
host_concurrency = 2

# A response must resolve successfully after retries. In particular, HTTP 429
# remains a retryable failure instead of being mistaken for a valid target.
accept = ["200..=399"]

# Do not attempt to validate localhost/private addresses used in
# local-development documentation.
exclude_all_private = true

# Email-address validation is outside the scope of documentation links.
include_mail = false

# Check the anchor as well as the page, so that renaming a heading breaks the
# build rather than silently orphaning every "#section" link that pointed at it.
# Local Markdown targets are parsed for their heading identifiers; remote pages
# are parsed from the response body.
include_fragments = "anchor-only"

# The workflow fetches organization-owned source trees here for deterministic
# Git object validation; Lychee should inspect only Learning's tracked content.
exclude_path = ["(^|/)\\.link-targets/"]

# Exclusions suppress link rot rather than reporting it, so each one needs a
# reason that is specific to the URL and not merely "this is sometimes slow".
# Transient slowness and throttling are handled by bounded retries. A persistent
# 429 remains visible so maintainers can retry the job or inspect authentication.
exclude = [
  # Private vulnerability reporting is intentionally conditional and may
  # return 404 to automated or unauthenticated link checkers.
  '^https://github\.com/AsiBackbone/Learning/security/advisories/new$',

  # These comparisons become resolvable only after the approved merge commit
  # is tagged v1.1.0. Keep the canonical changelog targets during PR checks.
  '^https://github\.com/AsiBackbone/Learning/compare/v1\.0\.0\.\.\.v1\.1\.0$',
  '^https://github\.com/AsiBackbone/Learning/compare/v1\.1\.0\.\.\.HEAD$',

  # Zenodo DOI occasionally times out for automated link validation.
  '^https://doi\.org/10\.5281/zenodo\.21938556$'
]
