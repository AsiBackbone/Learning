<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
  <title id="title">Policy context, constraints, and decision composition</title>
  <desc id="desc">Policy context containing facts fans out to three constraints. Constraint results flow into an explicit composition strategy that produces one governance decision. Three reminders state that context is not policy, a constraint result is not the final decision, and a decision is not execution.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#52606d"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, Helvetica, sans-serif; fill: #102a43; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #486581; }
      .boxtext { font: 700 23px Arial, Helvetica, sans-serif; fill: #102a43; text-anchor: middle; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #334e68; text-anchor: middle; }
      .rule { font: 700 21px Arial, Helvetica, sans-serif; fill: #7b341e; text-anchor: middle; }
      .arrow { stroke: #52606d; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="930" fill="#ffffff"/>
  <text x="600" y="56" class="title" text-anchor="middle">Context, Constraints, and Composition</text>
  <text x="600" y="90" class="subtitle" text-anchor="middle">Facts are interpreted by constraints; composition produces the final governance decision.</text>

  <rect x="60" y="245" width="280" height="230" rx="18" fill="#eaf4fb" stroke="#3978a8" stroke-width="3"/>
  <text x="200" y="292" class="boxtext">Policy Context</text>
  <text x="200" y="327" class="small">facts at evaluation time</text>
  <text x="200" y="365" class="small">intent • actor • resource</text>
  <text x="200" y="395" class="small">environment • region • risk</text>
  <text x="200" y="425" class="small">correlation • policy identity</text>

  <rect x="455" y="135" width="285" height="100" rx="14" fill="#f7fafc" stroke="#627d98" stroke-width="3"/>
  <text x="598" y="181" class="boxtext">Constraint A</text>
  <text x="598" y="211" class="small">interprets relevant facts</text>

  <rect x="455" y="310" width="285" height="100" rx="14" fill="#f7fafc" stroke="#627d98" stroke-width="3"/>
  <text x="598" y="356" class="boxtext">Constraint B</text>
  <text x="598" y="386" class="small">returns its own result</text>

  <rect x="455" y="485" width="285" height="100" rx="14" fill="#f7fafc" stroke="#627d98" stroke-width="3"/>
  <text x="598" y="531" class="boxtext">Constraint C</text>
  <text x="598" y="561" class="small">does not execute anything</text>

  <path d="M340 320 C390 320 400 185 455 185" class="arrow"/>
  <path d="M340 360 H455" class="arrow"/>
  <path d="M340 400 C390 400 400 535 455 535" class="arrow"/>

  <rect x="820" y="245" width="310" height="160" rx="18" fill="#fff7e6" stroke="#b7791f" stroke-width="3"/>
  <text x="975" y="292" class="boxtext">Decision Composition</text>
  <text x="975" y="327" class="small">explicit precedence / policy</text>
  <text x="975" y="360" class="small">combines constraint results</text>
  <text x="975" y="390" class="small">without performing the side effect</text>

  <path d="M740 185 C780 185 780 285 820 285" class="arrow"/>
  <path d="M740 360 H820" class="arrow"/>
  <path d="M740 535 C780 535 780 370 820 370" class="arrow"/>

  <path d="M975 405 V475" class="arrow"/>
  <rect x="820" y="480" width="310" height="120" rx="18" fill="#e9f7ef" stroke="#2f7d4e" stroke-width="3"/>
  <text x="975" y="528" class="boxtext">Governance Decision</text>
  <text x="975" y="562" class="small">allow • deny • defer</text>
  <text x="975" y="590" class="small">acknowledge • escalate</text>

  <line x1="55" y1="675" x2="1145" y2="675" stroke="#d9e2ec" stroke-width="2"/>

  <rect x="60" y="725" width="310" height="100" rx="14" fill="#fff2e8" stroke="#c05621" stroke-width="2"/>
  <text x="215" y="785" class="rule">Context ≠ Policy</text>

  <rect x="445" y="725" width="310" height="100" rx="14" fill="#fff2e8" stroke="#c05621" stroke-width="2"/>
  <text x="600" y="775" class="rule">Constraint Result</text>
  <text x="600" y="804" class="rule">≠ Final Decision</text>

  <rect x="830" y="725" width="310" height="100" rx="14" fill="#fff2e8" stroke="#c05621" stroke-width="2"/>
  <text x="985" y="785" class="rule">Decision ≠ Execution</text>
</svg>
