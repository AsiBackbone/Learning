name: Documentation Validation

on:
  workflow_dispatch:

  # This job is a required branch-protection check.
  # Run it for every PR targeting main so the required
  # check always reports a result.
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docs/templates/**'
      - 'tools/generate-feed.cs'
      - 'tools/generate-sitemap.cs'
      - 'tools/prepare-indexnow.cs'
      - 'tools/validate-doc-metadata.cs'
      - 'tools/validate-docfx-template-baseline.cs'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs-validation.yml'
      
# Deny all GitHub token permissions by default.
permissions: {}

concurrency:
  group: docs-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate-docs:
    name: Build DocFX documentation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # File-level Git history provides stable sitemap lastmod dates.
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Validate DocFX template baseline
        run: dotnet run --file tools/validate-docfx-template-baseline.cs

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build DocFX site
        run: dotnet tool run docfx docs/docfx.json --warningsAsErrors

      - name: Validate XML sitemap generator contract
        run: dotnet run --file tools/generate-sitemap.cs -- --self-test

      - name: Generate XML sitemap
        run: dotnet run --file tools/generate-sitemap.cs

      - name: Validate generated XML sitemap
        run: dotnet run --file tools/generate-sitemap.cs -- --validate

      - name: Validate IndexNow URL-selection contract
        run: dotnet run --file tools/prepare-indexnow.cs -- --self-test

      - name: Validate IndexNow publication contract
        run: >-
          dotnet run --file tools/prepare-indexnow.cs --
          --base HEAD --head HEAD --sitemap docs/_site/sitemap.xml --dry-run

      - name: Validate RSS feed generator contract
        run: dotnet run --file tools/generate-feed.cs -- --self-test

      - name: Generate RSS feed
        run: dotnet run --file tools/generate-feed.cs

      - name: Validate generated documentation metadata
        run: dotnet run --file tools/validate-doc-metadata.cs
