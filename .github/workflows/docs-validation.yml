name: Documentation Validation

on:
  workflow_dispatch:

  # This job is a required branch-protection check.
  # Run it for every PR targeting main so the required
  # check always reports a result.
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.config/dotnet-tools.json'
      - '.github/workflows/docs-validation.yml'
      
# Deny all GitHub token permissions by default.
permissions: {}

concurrency:
  group: docs-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate-docs:
    name: Build DocFX documentation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET information
        run: dotnet --info

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build DocFX site
        run: dotnet tool run docfx docs/docfx.json --warningsAsErrors
