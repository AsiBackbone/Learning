name: Link Validation

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - '.github/workflows/link-validation.yml'

  # Periodically detect external link rot even when documentation
  # has not recently changed.
  schedule:
    - cron: '17 13 * * 0'

# Deny all GitHub token permissions by default.
permissions: {}

concurrency:
  group: link-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-links:
    name: Validate documentation links
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Documentation links to this repository are written as absolute
      # github.com URLs so they work on GitHub, on the published DocFX site, and
      # in a local clone. Checking them live would validate main rather than the
      # revision under test, so a pull request that adds a file or directory
      # would fail until it is merged. Both remaps resolve those links against
      # the checked-out tree instead: blob/main for files, tree/main for
      # directories.
      - name: Validate Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --remap "^https://github\.com/AsiBackbone/Learning/blob/main file://${{ github.workspace }}"
            --remap "^https://github\.com/AsiBackbone/Learning/tree/main file://${{ github.workspace }}"
            './**/*.md'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          jobSummary: true
          