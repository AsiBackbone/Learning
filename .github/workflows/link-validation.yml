name: Link Validation

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - 'tools/fixtures/link-validation/**'
      - 'tools/validate-organization-links.cs'
      - '.github/workflows/link-validation.yml'

  # Periodically detect external link rot even when documentation
  # has not recently changed.
  schedule:
    - cron: '17 13 * * 0'

# Deny all GitHub token permissions by default.
permissions: {}

concurrency:
  group: link-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-links:
    name: Validate documentation links
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout AsiBackbone link targets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AsiBackbone/AsiBackbone
          path: .link-targets/AsiBackbone
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate organization-owned source links
        run: >-
          dotnet run --file tools/validate-organization-links.cs --
          --source-repository .link-targets/AsiBackbone
          --self-test

      # Documentation links to this repository are written as absolute
      # github.com URLs so they work on GitHub, on the published DocFX site, and
      # in a local clone. Checking them live would validate main rather than the
      # revision under test, so a pull request that adds a file or directory
      # would fail until it is merged. Both remaps resolve those links against
      # the checked-out tree instead: blob/main for files, tree/main for
      # directories.
      - name: Validate Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --remap "^https://github\.com/AsiBackbone/Learning/blob/main file://${{ github.workspace }}"
            --remap "^https://github\.com/AsiBackbone/Learning/tree/main file://${{ github.workspace }}"
            './**/*.md'
          # The pinned action exports this input as GITHUB_TOKEN, which Lychee
          # uses for authenticated GitHub requests and a higher rate limit.
          token: ${{ github.token }}
          fail: true
          jobSummary: true

      - name: Explain persistent GitHub throttling
        if: failure()
        shell: bash
        run: |
          if [[ -f lychee/out.md ]] && grep -Eqi '(^|[^0-9])429([^0-9]|$)|too many requests' lychee/out.md; then
            echo "::error::GitHub still returned HTTP 429 after authenticated retries. Treat this as a retryable validation failure; rerun the job and verify token permissions rather than accepting 429 as success."
          fi
