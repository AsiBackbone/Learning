name: Link Validation

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - '.github/workflows/link-validation.yml'

  push:
    branches:
      - main
    paths:
      - '**/*.md'
      - 'lychee.toml'
      - '.github/workflows/link-validation.yml'

  # Periodically detect external link rot even when documentation
  # has not recently changed.
  schedule:
    - cron: '17 13 * * 0'

# Deny all GitHub token permissions by default.
permissions: {}

concurrency:
  group: link-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-links:
    name: Validate documentation links
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Markdown links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            './**/*.md'
          token: ${{ secrets.GITHUB_TOKEN }}
          fail: true
          jobSummary: true
          