name: Publish Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'docs/templates/**'
      - 'tools/generate-feed.cs'
      - 'tools/generate-sitemap.cs'
      - 'tools/prepare-indexnow.cs'
      - 'tools/validate-docfx-template-baseline.cs'
      - '.config/dotnet-tools.json'
      - '.github/workflows/publish-docs.yml'

  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      indexnow_count: ${{ steps.indexnow.outputs.count }}
      indexnow_urls: ${{ steps.indexnow.outputs.urls }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # File-level Git history provides stable sitemap lastmod dates.
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Validate DocFX template baseline
        run: dotnet run --file tools/validate-docfx-template-baseline.cs

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Build DocFX site
        run: dotnet tool run docfx docs/docfx.json --warningsAsErrors

      - name: Validate XML sitemap generator contract
        run: dotnet run --file tools/generate-sitemap.cs -- --self-test

      - name: Generate XML sitemap
        run: dotnet run --file tools/generate-sitemap.cs

      - name: Validate generated XML sitemap
        run: dotnet run --file tools/generate-sitemap.cs -- --validate

      - name: Validate IndexNow URL-selection contract
        run: dotnet run --file tools/prepare-indexnow.cs -- --self-test

      - name: Validate RSS feed generator contract
        run: dotnet run --file tools/generate-feed.cs -- --self-test

      - name: Generate RSS feed
        run: dotnet run --file tools/generate-feed.cs

      - name: Validate generated documentation metadata
        run: dotnet run --file tools/validate-doc-metadata.cs

      - name: Resolve previously deployed revision
        id: deployed_revision
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          base=""
          deployed_revision=""
          revision_url="https://asibackbone.github.io/Learning/deployment-revision.txt"

          if deployed_revision="$(curl --fail --silent --location --max-time 10 "$revision_url" 2>/dev/null)"; then
            deployed_revision="${deployed_revision//$'\r'/}"
            deployed_revision="${deployed_revision//$'\n'/}"

            if [[ "$deployed_revision" =~ ^[0-9a-fA-F]{40}$ ]] \
              && git cat-file -e "${deployed_revision}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$deployed_revision" "$GITHUB_SHA"; then
              base="$deployed_revision"
              echo "Using previously deployed revision $base."
            fi
          fi

          if [[ -z "$base" ]] \
            && [[ "${EVENT_BEFORE:-}" =~ ^[0-9a-fA-F]{40}$ ]] \
            && [[ ! "$EVENT_BEFORE" =~ ^0{40}$ ]] \
            && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            base="$EVENT_BEFORE"
            echo "Using push base revision $base."
          fi

          if [[ -z "$base" ]]; then
            if git rev-parse --verify "${GITHUB_SHA}^" >/dev/null 2>&1; then
              base="$(git rev-parse "${GITHUB_SHA}^")"
              echo "Using parent revision $base as the fallback comparison base."
            else
              base="$GITHUB_SHA"
              echo "No earlier revision is available; IndexNow selection will be empty."
            fi
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Prepare IndexNow changed-URL payload
        id: indexnow
        env:
          INDEXNOW_BASE_SHA: ${{ steps.deployed_revision.outputs.base }}
        run: |
          set -euo pipefail

          payload="$RUNNER_TEMP/indexnow-payload.json"
          dotnet run --file tools/prepare-indexnow.cs -- \
            --base "$INDEXNOW_BASE_SHA" \
            --head "$GITHUB_SHA" \
            --sitemap docs/_site/sitemap.xml \
            --output "$payload"

          count="$(jq -r '.urlList | length' "$payload")"
          urls="$(jq -c '.urlList' "$payload")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "urls=$urls" >> "$GITHUB_OUTPUT"

      - name: Record deployed revision
        run: printf '%s\n' "$GITHUB_SHA" > docs/_site/deployment-revision.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  deploy-docs:
    name: Deploy documentation
    needs: build-docs
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0


  notify-indexnow:
    name: Notify IndexNow
    needs:
      - build-docs
      - deploy-docs
    if: ${{ needs.build-docs.outputs.indexnow_count != '0' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout verification material
        id: checkout
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Submit changed URLs to IndexNow
        id: submit
        if: ${{ steps.checkout.outcome == 'success' }}
        continue-on-error: true
        env:
          INDEXNOW_COUNT: ${{ needs.build-docs.outputs.indexnow_count }}
          INDEXNOW_URLS: ${{ needs.build-docs.outputs.indexnow_urls }}
        run: |
          set -euo pipefail

          key="$(tr -d '\r\n' < docs/indexnow-key.txt)"
          payload="$RUNNER_TEMP/indexnow-payload.json"
          jq -n \
            --arg host 'asibackbone.github.io' \
            --arg key "$key" \
            --arg keyLocation 'https://asibackbone.github.io/Learning/indexnow-key.txt' \
            --argjson urlList "$INDEXNOW_URLS" \
            '{ host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList }' \
            > "$payload"

          response="$RUNNER_TEMP/indexnow-response.txt"
          if ! status="$(
            curl --silent --show-error --fail-with-body \
              --retry 2 --retry-delay 2 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              --output "$response" \
              --write-out '%{http_code}' \
              --header 'Content-Type: application/json; charset=utf-8' \
              --data-binary "@$payload" \
              https://api.indexnow.org/indexnow
          )"; then
            cat "$response" >&2 || true
            exit 1
          fi

          if [[ "$status" != "200" && "$status" != "202" ]]; then
            cat "$response" >&2 || true
            echo "Unexpected IndexNow response HTTP $status." >&2
            exit 1
          fi

          echo "IndexNow accepted $INDEXNOW_COUNT changed URL(s) with HTTP $status."

      - name: Report non-blocking IndexNow failure
        if: ${{ steps.checkout.outcome == 'failure' || steps.submit.outcome == 'failure' }}
        run: >-
          echo "::warning::IndexNow notification failed after a successful Pages deployment;
          the published documentation remains valid and the sitemap remains available for crawler discovery."
